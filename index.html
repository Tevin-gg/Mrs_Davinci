<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Stick Man's Press Office — Exclusive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{ --ink:#2a2410; --ink-dim:#6b6353; --gold:#f2c14e; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#000; overflow-x:hidden; }
  body{ font-family:'Space Mono', monospace; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain; }
  .serif{ font-family:'Playfair Display', Georgia, serif; }
  button{ font-family:inherit; font-size:16px; border:none; background:none; cursor:pointer; }
  ::selection{ background:#fff; color:#000; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  .fade-up{ animation:fadeUp .5s ease both; }
  @keyframes stampIn{ 0%{ transform:scale(2.6) rotate(-18deg); opacity:0;} 60%{ transform:scale(0.92) rotate(-8deg); opacity:1;} 100%{ transform:scale(1) rotate(-8deg); opacity:1;} }
  .stamp-in{ animation:stampIn .5s cubic-bezier(.3,.7,.3,1.3) both; }

  .flash-overlay{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }
  .flash-run{ animation:cameraFlash .35s ease; }
  @keyframes cameraFlash{ 0%{ opacity:0;} 15%{ opacity:0.85;} 100%{ opacity:0;} }

  /* ---- Story progress bar ---- */
  .story-progress{ position:fixed; top:0; left:0; right:0; display:flex; gap:5px; padding:12px 14px; z-index:50; }
  .story-seg{ flex:1; height:3.5px; border-radius:2px; background:rgba(255,255,255,0.28); }
  .story-seg.active{ background:#fff; }
  .story-seg.done{ background:rgba(255,255,255,0.75); }

  /* ---- Slide shell ---- */
  .slide{ min-height:100vh; width:100%; display:flex; flex-direction:column; padding:56px 22px 34px; color:#fff; position:relative; }
  .slide-inner{ flex:1; display:flex; flex-direction:column; }
  .bg-cover{ background:linear-gradient(160deg,#ff5f6d 0%,#a34bff 55%,#4b6cff 100%); }
  .bg-interview{ background:linear-gradient(160deg,#0f2027 0%,#2c5364 55%,#6a3093 100%); }
  .bg-headline{ background:linear-gradient(160deg,#d6009c 0%,#ff6a00 100%); }
  .bg-consent{ background:linear-gradient(160deg,#7b2ff7 0%,#f107a3 100%); }
  .bg-processing{ background:linear-gradient(160deg,#0f0c29 0%,#302b63 55%,#24243e 100%); }
  .bg-verdict{ background:linear-gradient(160deg,#d31027 0%,#ea384d 55%,#b0362f 100%); }
  .bg-finale{ background:linear-gradient(160deg,#ffecd2 0%,#fcb69f 100%); }

  .cover-center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

  .badge-pill{ display:inline-block; align-self:center; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4); padding:6px 16px; border-radius:999px; font-size:11px; letter-spacing:3px; margin-bottom:18px; }
  .badge-pill.small{ align-self:flex-start; font-size:10px; padding:5px 12px; }
  .badge-pill.dark{ background:rgba(42,36,16,0.08); border-color:rgba(42,36,16,0.3); color:var(--ink); }

  .hero-title{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:clamp(34px,9vw,52px); line-height:1.08; text-align:center; margin:0 0 14px; }
  .hero-sub{ text-align:center; font-size:13px; letter-spacing:1px; opacity:0.85; margin:0 0 10px; }
  .hero-tag{ text-align:center; font-style:italic; font-size:15px; opacity:0.9; }

  .ticker-wrap{ overflow:hidden; white-space:nowrap; background:rgba(0,0,0,0.25); padding:7px 0; margin:-56px -22px 26px; }
  .ticker-track{ display:inline-block; font-size:10px; letter-spacing:1.5px; animation:tickerScroll 22s linear infinite; }
  @keyframes tickerScroll{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  .big-btn{ width:100%; padding:17px; border-radius:999px; background:#fff; color:#171412; font-weight:700; letter-spacing:1px; font-size:14px; transition:opacity .2s ease, transform .2s ease; }
  .big-btn:active{ transform:scale(0.97); }
  .big-btn:disabled{ background:rgba(255,255,255,0.25); color:rgba(255,255,255,0.6); cursor:not-allowed; }

  /* ---- Poll / interview ---- */
  .poll-question{ font-size:19px; font-weight:700; line-height:1.4; margin:6px 0 24px; }
  .poll-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .poll-chip{ position:relative; text-align:left; padding:14px 16px; border-radius:16px; background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.35); backdrop-filter:blur(6px); color:#fff; font-size:14px; overflow:hidden; transition:opacity .2s ease; }
  .poll-chip.selected{ background:rgba(255,255,255,0.95); color:#171412; border-color:#fff; }
  .poll-chip.dim{ opacity:0.55; }
  .poll-chip-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .poll-pct{ font-size:12px; font-weight:700; opacity:0.75; flex-shrink:0; }
  .poll-check{ font-weight:700; flex-shrink:0; }
  .poll-bar-track{ height:4px; border-radius:2px; background:rgba(120,110,90,0.25); margin-top:8px; overflow:hidden; }
  .poll-bar-fill{ height:100%; background:#7b2ff7; border-radius:2px; }
  .reaction-text{ font-size:13px; font-style:italic; opacity:0.9; text-align:center; margin-bottom:18px; }

  .section-lede{ font-size:13px; opacity:0.85; margin:0 0 18px; }
  .section-lede.dark{ color:var(--ink-dim); }

  /* ---- Polaroid / headline builder ---- */
  .polaroid{ background:#fdfaf3; padding:14px 14px 34px; border-radius:4px; box-shadow:0 18px 40px rgba(0,0,0,0.35); transform:rotate(-2.5deg); margin:6px auto 20px; width:78%; max-width:230px; position:relative; cursor:pointer; }
  .tape{ position:absolute; width:44px; height:16px; background:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.7); top:-8px; }
  .tape-left{ left:-10px; transform:rotate(-40deg); }
  .tape-right{ right:-10px; transform:rotate(40deg); }
  .polaroid-photo{ aspect-ratio:1/1; background:#e8e0cf; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; transition:background .4s ease; overflow:hidden; }
  .polaroid-photo.developed{ background:#d8cdb0; }
  .polaroid-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tap-hint{ font-size:9px; letter-spacing:1.5px; color:#8a7a5c; }
  .polaroid-caption{ font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:12px; color:#2a2410; text-align:center; margin-top:10px; }

  .magazine-banner{ background:#fff; color:#171412; font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:13px; line-height:1.4; text-align:center; padding:12px 14px; margin-bottom:16px; border-top:3px solid #171412; border-bottom:3px solid #171412; }

  .headline-scroll{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:10px; margin-bottom:16px; -webkit-overflow-scrolling:touch; }
  .headline-chip{ flex:0 0 auto; scroll-snap-align:start; max-width:220px; background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.35); color:#fff; font-size:11.5px; line-height:1.4; padding:12px 14px; border-radius:12px; text-align:left; }
  .headline-chip.selected{ background:#fff; color:#171412; border-color:#fff; }

  /* ---- Consent chips ---- */
  .chip-grid{ display:flex; flex-direction:column; gap:10px; }
  .consent-chip{ position:relative; text-align:left; padding:14px 16px; border-radius:14px; background:rgba(255,255,255,0.12); border:1.5px dashed rgba(255,255,255,0.4); color:#fff; font-size:13px; line-height:1.4; }
  .consent-chip.stamped{ background:rgba(255,255,255,0.95); color:#171412; border-style:solid; border-color:#fff; }
  .stamped-badge{ display:block; font-size:9px; letter-spacing:2px; color:#b0362f; font-weight:700; margin-bottom:4px; }

  .postcard{ background:#fdfaf3; border-radius:8px; padding:10px; margin-bottom:18px; }
  .sig-canvas{ width:100%; height:120px; background:#fffdf7; border:1px dashed #d8cdb0; border-radius:4px; display:block; }
  .clear-link{ font-size:11px; letter-spacing:2px; color:#8a7a5c; margin-top:8px; }

  /* ---- Processing ---- */
  .stars{ position:absolute; inset:0; overflow:hidden; }
  .star{ position:absolute; border-radius:50%; background:#fff; animation:twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.15;} 50%{ opacity:0.9;} }
  .spinner{ width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin 1s linear infinite; margin-bottom:22px; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .processing-text{ font-size:14px; opacity:0.9; text-align:center; }

  /* ---- Stop the Presses ---- */
  .press-button{ width:180px; height:180px; border-radius:50%; background:#fff; color:#b0362f; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(255,255,255,0.18), 0 20px 50px rgba(0,0,0,0.4); transition:transform .15s ease; }
  .press-button:active{ transform:scale(0.94); }
  .press-button-label{ font-family:'Playfair Display',Georgia,serif; font-weight:700; letter-spacing:2px; font-size:19px; line-height:1.3; text-align:center; }

  .printing-wrap{ width:100%; max-width:280px; display:flex; flex-direction:column; align-items:center; }
  .ink-bar{ width:100%; height:10px; border-radius:5px; background:rgba(255,255,255,0.85); margin-bottom:8px; opacity:0; animation:inkSweep 1.1s ease forwards; }
  @keyframes inkSweep{ 0%{ opacity:0; transform:scaleX(0); } 30%{ opacity:1; transform:scaleX(1);} 100%{ opacity:0.15; transform:scaleX(1);} }

  /* ---- Finale: actual newspaper ---- */
  .slide.np-scroll{ overflow-y:auto; padding:0; align-items:stretch; display:block; height:100vh; }
  .newspaper-page{ background:#fdfaf3; color:#221f1a; max-width:520px; margin:0 auto; padding:34px 22px 60px; font-family:'Space Mono',monospace; min-height:100vh; }
  .np-masthead{ text-align:center; margin-bottom:14px; }
  .np-ribbon{ display:inline-block; background:#b0362f; color:#fff; font-size:10px; letter-spacing:3px; padding:4px 12px; border-radius:2px; margin-bottom:10px; }
  .np-title{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:clamp(30px,8vw,42px); margin:0 0 8px; letter-spacing:1px; }
  .np-subline{ display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:1px; color:#6b6353; border-top:1px solid #2a2410; border-bottom:1px solid #2a2410; padding:5px 0; }
  .np-rule{ height:3px; background:#2a2410; margin:14px 0; }
  .np-rule.thin{ height:1px; background:#d8cdb0; margin:20px 0; }
  .np-headline{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:clamp(22px,6vw,30px); line-height:1.15; margin:0 0 8px; }
  .np-byline{ font-size:10px; letter-spacing:1px; color:#6b6353; margin-bottom:16px; }
  .np-lead-row{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .np-photo-wrap{ flex:0 0 120px; width:120px; display:flex; flex-direction:column; gap:6px; }
  .np-photo{ width:120px; height:140px; background:#e8e0cf; border:1px solid #2a2410; overflow:hidden; }
  .np-photo-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .np-photo-caption{ font-size:8.5px; letter-spacing:0.5px; color:#6b6353; text-align:center; line-height:1.4; }
  .np-columns{ flex:1; min-width:160px; font-size:12.5px; line-height:1.65; column-count:1; }
  .np-columns p{ margin:0 0 10px; }

  .np-editors-note{ background:#f3ecd8; border:1px solid #2a2410; padding:16px; }
  .np-editors-label{ font-size:10px; letter-spacing:2px; color:#b0362f; font-weight:700; margin-bottom:10px; }
  .np-editors-note p{ font-size:13px; line-height:1.7; margin:0 0 12px; }
  .np-editors-sign{ font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:700; font-size:20px; color:#b0362f; text-align:right; margin-top:6px !important; }

  .np-sidebar-grid{ display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .np-box{ border:1px solid #2a2410; padding:12px 14px; }
  .np-box-title{ font-size:10.5px; letter-spacing:2px; font-weight:700; border-bottom:1px solid #2a2410; padding-bottom:6px; margin-bottom:8px; }
  .np-box p{ font-size:11.5px; line-height:1.55; margin:0 0 6px; color:#3a3324; }

  .np-comic{ margin-bottom:20px; }
  .np-comic-row{ display:flex; gap:10px; margin-top:8px; }
  .np-panel{ flex:1; border:1px solid #2a2410; padding:10px 6px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .np-panel svg{ width:36px; height:36px; margin-bottom:8px; }
  .np-panel-caption{ font-size:8.5px; letter-spacing:0.3px; line-height:1.4; margin:0; }

  .np-footer{ text-align:center; font-size:10px; letter-spacing:1px; color:#8a7a5c; font-style:italic; }


.w-full{width:100%}
.touch-none{touch-action:none}

</style>
</head>
